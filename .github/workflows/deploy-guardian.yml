name: Deploy guardian image

# Only the guardian's own image (guardian/) - the VM app stack has its
# separate pipeline in deploy.yml, see #78. This workflow only publishes
# the image to ghcr.io; bumping the live Container App to the new tag and
# retiring the old ACR are manual steps done once, see #84.
on:
  push:
    branches: [master]
    paths:
      - "guardian/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN can't push packages here - the repo's default workflow
      # permissions are read-only (org/repo setting, not overridable from
      # the workflow's own `permissions:` block). Using a classic PAT
      # (`GHCR_PAT`, scope write:packages) scoped to this one write instead
      # of widening the repo's default token permissions for every workflow.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: CharlesOo0
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-buildx-action@v3

      # ghcr.io requires a lowercase image path - the GitHub org/user here
      # ("CharlesOo0") is mixed case, so it's hardcoded rather than derived
      # from github.repository_owner.
      - uses: docker/build-push-action@v6
        with:
          context: guardian
          push: true
          tags: |
            ghcr.io/charlesoo0/easyrag-guardian:latest
            ghcr.io/charlesoo0/easyrag-guardian:${{ github.sha }}
