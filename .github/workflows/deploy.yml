name: Deploy

# Only the app stack on the VM (backend/frontend/Caddy) - the guardian
# (guardian/) has its own separate lifecycle (ACR build + Container App
# update, not this VM) and is deliberately excluded, see #78.
on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - "entrypoint.sh"
      - "manage.py"
      - "requirements.txt"
      - "apps/**"
      - "core/**"
      - "front/**"
      - "scripts/bootstrap.sh"
  workflow_dispatch: {}

permissions:
  id-token: write # required for Azure OIDC login - no stored client secret
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The guardian may have put the VM to sleep - wake it before trying to
      # deploy onto it. Not `az vm start` directly: that bypasses the
      # guardian, whose own idle-shutdown tick has no idea a legitimate wake
      # just happened and can deallocate the VM again moments later - hit
      # for real in prod (2026-10-01), start+deallocate landed within a
      # second of each other, failing this whole job. Hitting the real site
      # instead updates the guardian's own bookkeeping, so its tick won't
      # treat the VM as idle. A non-200 here is expected (503 "waking up")
      # and fine - the next step's own retry loop waits out the actual boot.
      - name: Wake the VM
        run: curl -s -o /dev/null -m 15 -A "Mozilla/5.0 (compatible; EasyRagDeployWake/1.0)" https://easyrag.dev/ || true

      # az vm run-command executes as root on the VM through the Azure API -
      # no SSH port needs to be open to GitHub's runner IP ranges for this.
      # A few retries: the VM agent can take a short while to start accepting
      # commands right after boot.
      #
      # Script details, each one a real bug hit testing this manually before
      # trusting it in CI:
      #   - `git -c safe.directory=...`: run-command executes as root, but
      #     the clone is owned by azureuser - git refuses to touch a repo it
      #     doesn't own unless told this exact directory is trusted.
      #   - `reset --hard FETCH_HEAD`, not `origin/master`: the VM's clone is
      #     a shallow, single-branch clone (whatever branch it was first set
      #     up on) - there's no local `origin/master` tracking ref to reset
      #     to, but FETCH_HEAD always exists right after a fetch.
      #   - `chmod +x`: the bind-mounted source overwrites entrypoint.sh's
      #     executable bit on every fresh clone.
      #   - `. ./.env.prod`, not `source .env.prod`: run-command's shell is
      #     dash, not bash - `source` doesn't exist, and POSIX `.` without a
      #     leading `./` searches $PATH instead of the current directory.
      - name: Pull and redeploy on the VM
        run: |
          for i in $(seq 1 5); do
            if az vm run-command invoke \
              --resource-group easyrag-prod-rg \
              --name easyrag-prod-vm \
              --command-id RunShellScript \
              --scripts "cd /home/azureuser/app && git -c safe.directory=/home/azureuser/app fetch origin master && git -c safe.directory=/home/azureuser/app reset --hard FETCH_HEAD && chmod +x entrypoint.sh scripts/bootstrap.sh && set -a && . ./.env.prod && set +a && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build" \
              --query "value[0].message" -o tsv; then
              exit 0
            fi
            echo "run-command not ready yet, retrying..."
            sleep 20
          done
          echo "::error::Deploy command never succeeded" && exit 1

      - name: Verify the site is back up
        # -A: the guardian now rejects curl's default User-Agent as a bot
        # signature (guardian/app/bot_user_agents.py) - without this flag
        # this check would 404 even on a healthy deploy.
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 -A "Mozilla/5.0 (compatible; EasyRagDeployCheck/1.0)" https://easyrag.dev/ || true)
            if [ "$code" = "200" ]; then
              echo "Site healthy (HTTP $code)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Site did not come back healthy after deploy" && exit 1
