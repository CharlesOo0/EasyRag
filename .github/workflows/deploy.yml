name: Deploy

# Only the app stack on the VM (backend/frontend/Caddy) - the guardian
# (guardian/) has its own separate lifecycle (ACR build + Container App
# update, not this VM) and is deliberately excluded, see #78.
on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - "entrypoint.sh"
      - "manage.py"
      - "requirements.txt"
      - "apps/**"
      - "core/**"
      - "front/**"
      - "scripts/bootstrap.sh"
  workflow_dispatch: {}

permissions:
  id-token: write # required for Azure OIDC login - no stored client secret
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The guardian may have put the VM to sleep - wake it before trying to
      # deploy onto it. `az vm start` on an already-running VM is a safe no-op.
      - name: Wake the VM
        run: az vm start --resource-group easyrag-prod-rg --name easyrag-prod-vm

      # az vm run-command executes as root on the VM through the Azure API -
      # no SSH port needs to be open to GitHub's runner IP ranges for this.
      # A few retries: the VM agent can take a short while to start accepting
      # commands right after boot.
      - name: Pull and redeploy on the VM
        run: |
          for i in $(seq 1 5); do
            if az vm run-command invoke \
              --resource-group easyrag-prod-rg \
              --name easyrag-prod-vm \
              --command-id RunShellScript \
              --scripts "cd /home/azureuser/app && git fetch origin master && git reset --hard origin/master && set -a && source .env.prod && set +a && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build" \
              --query "value[0].message" -o tsv; then
              exit 0
            fi
            echo "run-command not ready yet, retrying..."
            sleep 20
          done
          echo "::error::Deploy command never succeeded" && exit 1

      - name: Verify the site is back up
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://easyrag.dev/ || true)
            if [ "$code" = "200" ]; then
              echo "Site healthy (HTTP $code)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Site did not come back healthy after deploy" && exit 1
