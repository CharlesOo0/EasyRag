# Production overrides for docker-compose.yml - see docs/DEPLOYMENT.md
# "Simplest path" for the full picture (TLS proxy in front, frontend built
# and served separately - neither is part of this file).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Every value below comes from the environment (a real .env file on the
# target host, never committed) - nothing here is a usable default. The
# required ones (SECRET_KEY, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS,
# CSRF_TRUSTED_ORIGINS) fail the deploy loudly if left unset instead of
# silently starting insecure.
#
# Compose doesn't share YAML anchors across files, so the same block is
# repeated for bootstrap and backend (they share `x-backend-env` in the
# base file, but only within that one file).

x-prod-env: &prod-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set for production - see docs/DEPLOYMENT.md}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set for production - see docs/DEPLOYMENT.md}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set for production - see docs/DEPLOYMENT.md}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set for production - see docs/DEPLOYMENT.md}
  # True behind the TLS-terminating proxy from the "Domaine + TLS" step
  # (docs/azure-deployment-plan.md) - required or the HTTPS redirect loops.
  USE_X_FORWARDED_PROTO: "True"
  # One proxy hop in front (Caddy) - see docs/DEPLOYMENT.md's warning on why
  # this must not be left at the dev default of 0.
  TRUSTED_PROXY_COUNT: "1"

services:
  bootstrap:
    environment:
      <<: *prod-env
  backend:
    environment:
      <<: *prod-env
