# Production overrides for docker-compose.yml - see docs/DEPLOYMENT.md
# "Simplest path" for the full picture. Swaps the frontend's dev server for
# a real SSR build (react-router-serve) and adds Caddy in front of it and
# the backend - the guardian (Container App) only knows one address
# (GUARDIAN_VM_ORIGIN), so both must sit behind one port here. TLS is
# terminated at the guardian, not here - see "Décision TLS" in
# docs/azure-deployment-plan.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Every value below comes from the environment (a real .env file on the
# target host, never committed) - nothing here is a usable default. The
# required ones (SECRET_KEY, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS,
# CSRF_TRUSTED_ORIGINS) fail the deploy loudly if left unset instead of
# silently starting insecure.
#
# Compose doesn't share YAML anchors across files, so the same block is
# repeated for bootstrap and backend (they share `x-backend-env` in the
# base file, but only within that one file).

x-prod-env: &prod-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set for production - see docs/DEPLOYMENT.md}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set for production - see docs/DEPLOYMENT.md}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set for production - see docs/DEPLOYMENT.md}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS must be set for production - see docs/DEPLOYMENT.md}
  # True behind the TLS-terminating proxy from the "Domaine + TLS" step
  # (docs/azure-deployment-plan.md) - required or the HTTPS redirect loops.
  USE_X_FORWARDED_PROTO: "True"
  # One proxy hop in front (Caddy) - see docs/DEPLOYMENT.md's warning on why
  # this must not be left at the dev default of 0.
  TRUSTED_PROXY_COUNT: "1"

services:
  bootstrap:
    environment:
      <<: *prod-env
  backend:
    environment:
      <<: *prod-env
    # Dev publishes 8000 straight to the host for local access - in prod
    # only Caddy talks to it, over the compose network.
    ports: !reset []

  frontend:
    build:
      context: ./front
      # The final stage - a real SSR build served by react-router-serve,
      # not the dev-server target the base file uses.
      target: production
      args:
        # Same-origin relative path: correct whether reached directly or
        # via the guardian in front, whatever domain ends up in the URL bar.
        VITE_API_URL: /api
    command: null
    volumes: !reset []
    ports: !reset []
    environment: !reset []
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    # Dev exposes this so the model can be poked at directly from the host;
    # in prod only the backend needs it, over the compose network - no
    # reason to publish it (Ollama has no auth of its own).
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddyfile", "--adapter", "caddyfile"]
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
